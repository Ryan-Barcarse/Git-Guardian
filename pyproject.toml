[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "git-guardian-local"
version = "0.2.1"
description = "A Python tool that helps prevent unsafe Git commits"
readme = "README.md"
requires-python = ">=3.9"


[project.scripts]
git-guardian = "cli:main"

[tool.setuptools]
py-modules = ["git_guardian", "cli", "installer"]